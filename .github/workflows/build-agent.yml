name: Build agente de impresión (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Compilar instalador (.msi y .exe)
        run: cargo tauri build

      - name: Subir instaladores como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: agente-impresion-instaladores
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-debug:
    # Job APARTE, solo para diagnóstico — compila con consola visible, así
    # que si el programa truena al abrirlo, aparece el mensaje de error real
    # en una ventana de consola en vez de morir en silencio.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar en modo depuración (sin empaquetar instalador)
        run: cargo build
        working-directory: src-tauri

      - name: Subir el .exe de depuración
        uses: actions/upload-artifact@v4
        with:
          name: agente-debug-exe
          path: src-tauri/target/debug/agente-impresion-facturacion.exe
