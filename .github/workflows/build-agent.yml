name: Build agente de impresión (Windows)

# Antes: solo `push: branches: [main]` + workflow_dispatch — ninguno de
# los dos produce jamás una ref `refs/tags/...`, así que el paso
# "Publicar Release automático" (con `if: startsWith(github.ref,
# 'refs/tags/')`) nunca se ejecutaba. Ahora: un push de un tag `v*` SÍ
# dispara el job de release; un push normal a `main` sigue disparando
# solo el build de depuración (chequeo rápido de que compila, sin tocar
# ningún Release).
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  pruebas:
    # Ronda 10b: las pruebas del servidor/cola/gaveta (testbed/) corren en cada push — no necesitan Tauri ni Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (testbed)
        run: cargo test -- --test-threads=1
        working-directory: testbed

  release:
    # Solo corre cuando el push fue de un tag (v1.0.0, v1.0.1, ...) — nunca
    # en un push común a main ni en un workflow_dispatch manual sin tag.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # tauri-action necesita esto para crear/editar el Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      # Ronda 10b: el updater compara contra la versión de tauri.conf.json, y la
      # pantalla/log muestran la de Cargo.toml. Si el tag, Cargo.toml y
      # tauri.conf.json no coinciden, el release sale con un latest.json que
      # engaña al updater ("ya tienes la última versión" sin ser cierto).
      - name: Verificar que tag, Cargo.toml y tauri.conf.json coinciden
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"; TAG="${TAG#-}"
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          CONF=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed 's/.*: *"\(.*\)".*/\1/')
          echo "tag=$TAG cargo=$CARGO conf=$CONF"
          if [ "$TAG" != "$CARGO" ] || [ "$CARGO" != "$CONF" ]; then
            echo "::error::Versiones distintas: tag=$TAG, Cargo.toml=$CARGO, tauri.conf.json=$CONF. Corrígelas y vuelve a crear el tag."
            exit 1
          fi

      # Reemplaza "cargo tauri build" + softprops/action-gh-release: arma
      # el build Y genera/sube el `latest.json` que tauri.conf.json espera
      # en plugins.updater.endpoints (formato JSON exacto que el plugin
      # necesita: version, notes, pub_date, platforms.windows-x86_64.{url,
      # signature}) — el workflow anterior no lo generaba, así que el
      # updater de B5 nunca iba a encontrar una actualización aunque el
      # build y el release salieran perfectos.
      - name: Compilar y publicar el release firmado
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # github.ref_name en un push de tag YA es el nombre del tag
          # (ej. "v1.0.1") — no hace falta generarlo desde __VERSION__
          # porque acá el tag lo creaste vos a mano (ver LEEME), no la
          # acción.
          tagName: ${{ github.ref_name }}
          releaseName: "Agente de impresión ${{ github.ref_name }}"
          releaseBody: "Ver los archivos adjuntos para instalar. Un agente ya instalado se actualiza solo."
          # Draft a propósito: revisá las notas del release y confirmá que
          # el build esté bien ANTES de publicarlo a mano — recién ahí
          # queda visible en /releases/latest/, que es lo que consulta el
          # updater. Un release en draft es invisible para el endpoint.
          releaseDraft: true
          uploadUpdaterJson: true

  build-debug:
    # Chequeo rápido de que compila en cada push a main — nunca toca
    # ningún Release ni sube nada firmado. No corre en un push de tag (ese
    # caso ya lo cubre el build real de arriba).
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar en modo depuración (sin empaquetar instalador)
        run: cargo build
        working-directory: src-tauri

      - name: Subir el .exe de depuración
        uses: actions/upload-artifact@v4
        with:
          name: agente-debug-exe
          path: src-tauri/target/debug/agente-impresion-facturacion.exe
