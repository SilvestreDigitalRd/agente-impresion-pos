[package]
name = "agente-impresion-facturacion"
version = "1.0.0"
description = "Agente local de impresión térmica — Facturación POS (Silvestre Digital RD)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
rand = "0.8"
subtle = "2.5"          # comparación de tokens en tiempo constante (anti timing-attack)
base64 = "0.22"
dirs = "5"

# Enlaces directos a la API de impresión de Win32 — CERO llamadas a cmd.exe/shell.
# Esto es lo que elimina por completo el riesgo de inyección de comandos.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Graphics_Printing",
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[[bin]]
name = "agente-impresion-facturacion"
path = "src/main.rs"
