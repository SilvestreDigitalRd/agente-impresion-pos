[package]
name = "agente-impresion-facturacion"
version = "1.0.0"
description = "Agente local de impresión térmica — Facturación POS (Silvestre Digital RD)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
# Auditoría, hallazgo B5: el actualizador firmado del agente. La firma del
# PAQUETE de actualización es obligatoria en Tauri y no se puede
# desactivar (distinto de un certificado Authenticode de Windows, que es
# aparte y no es requisito para que esto funcione) — ver el comentario
# largo en src/updater.rs para el diseño completo.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "limit"] }
rand = "0.8"
subtle = "2.5"          # comparación de tokens en tiempo constante (anti timing-attack)
base64 = "0.22"
dirs = "5"
# Auditoría, hallazgo A9: reenvía la impresión en red HACIA la LAN desde
# ACÁ (el agente), no desde el navegador — un navegador en HTTPS (Vercel)
# no puede hacerle fetch() a http://<ip-lan> por contenido mixto, así que
# el modo "red" quedaba roto en producción. El agente no tiene esa
# restricción del navegador. rustls en vez de openssl-sys: sin dependencia
# nativa de OpenSSL que compilar en Windows, y no hace falta TLS de
# verdad acá (la impresora habla HTTP plano en la LAN).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Enlaces directos a la API de impresión de Win32 — CERO llamadas a cmd.exe/shell.
# Esto es lo que elimina por completo el riesgo de inyección de comandos.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Graphics_Printing",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",   # OpenPrinterW, PRINTER_INFO_2W, CreateDCW, TextOutW, etc.
  "Win32_Security",       # PRINTER_INFO_2W también lo exige
  "Win32_Storage_Xps",    # StartDocW/EndDoc/StartPage/EndPage/DOCINFOW viven aquí, no en Gdi
] }

[[bin]]
name = "agente-impresion-facturacion"
path = "src/main.rs"
